<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body { background-color: #121212; color: #fff; font-family: sans-serif; text-align: center; margin: 0; }
        .user-panel { background: linear-gradient(135deg, #f39c12, #aa6c06); margin: 15px; padding: 20px; border-radius: 15px; color: #000; }
        .balance { font-size: 28px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="user-panel">
        <div>👋 សួស្តី, <span id="user-name">Guest</span></div>
        <div style="font-size: 14px;">ID របស់អ្នក: <span id="user-id">000000</span></div>
        <div style="font-size: 12px; margin-top: 10px;">សមតុល្យហ្វ្រី (Bonus)</div>
        <div class="balance">$<span id="user-balance">0.00</span></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";


import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";

const firebaseConfig = {
  apiKey: "AIzaSyA273ParAWzm4_vuPwO0OhjZ7oOLlPTv1Q",
  authDomain: "luckytest-b2f38.firebaseapp.com",
  databaseURL: "https://luckytest-b2f38-default-rtdb.firebaseio.com",
  projectId: "luckytest-b2f38",
  storageBucket: "luckytest-b2f38.firebasestorage.app",
  messagingSenderId: "583820360492",
  appId: "1:583820360492:web:f9887975b7abb4ff7dca89",
  measurementId: "G-H00L4D154G"
};


const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe.user;

        if (user) {
            const userRef = ref(db, 'users/' + user.id);

          
            get(userRef).then((snapshot) => {
                if (!snapshot.exists()) {
                    
                    const newUser = {
                        name: user.first_name,
                        id: user.id,
                        balance: 10.00, // 
                        registeredAt: new Date().toLocaleString()
                    };
                    set(userRef, newUser);
                    updateUI(newUser.name, newUser.id, newUser.balance);
                } else {
                    
                    const data = snapshot.val();
                    updateUI(data.name, data.id, data.balance);
                }
            });
        }

        function updateUI(name, id, balance) {
            document.getElementById('user-name').innerText = name;
            document.getElementById('user-id').innerText = id;
            document.getElementById('user-balance').innerText = balance.toFixed(2);
        }
    </script>
</body>
</html>
